<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idek</title>

    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>

<nav>
    <div class="logo">
        <a href="../index.html" style="text-decoration: none; color: inherit;">
            Mizartz
        </a>
    </div>

    <div class="nav-center" id="rotating-text">
        wait hoe im loading!
    </div>

    <ul class="nav-links">
        <li>
            <a href="/" aria-label="Home">
                <img src="../images/icons/home.png" alt="">
            </a>
        </li>

        <li>
            <a href="https://buymeacoffee.com/optic"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Buy me a coffee">
                <img src="../images/icons/coffee-cup.png" alt="">
            </a>
        </li>
    </ul>
</nav>

<main class="content">
    <main class="center">

        <h1><b>Welcome to my terrible site</b></h1>

        <p style="
            word-break: break-all;
            line-height: 1.6;
            max-width: 95%;
        ">
            click the copy button below to copy the framework
        </p>

        <div style="margin-top: 20px;">
            <a href="#"
               id="copyCodeBtn"
               aria-label="Copy text"
               style="
                    display: inline-flex;
                    align-items: center;
                    justify-content: center;
                    width: 56px;
                    height: 56px;
                    border-radius: 16px;
                    background-color: #f2ef58;
                    transition: 0.3s;
                    text-decoration: none;
               ">
                <img src="../images/icons/copy.png"
                     alt=""
                     style="
                        width: 32px;
                        height: 32px;
                     ">
            </a>
        </div>

    </main>
</main>

<script>
const textToCopy = `PASTE YOUR STRING HERE`;

const copyBtn = document.getElementById("copyCodeBtn");

copyBtn.addEventListener("click", async (e) => {
    e.preventDefault();

    try {
        await navigator.clipboard.writeText(textToCopy);

        copyBtn.style.boxShadow = "0 0 14px #f7f5a7";

        setTimeout(() => {
            copyBtn.style.boxShadow = "none";
        }, 500);

    } catch (err) {
        console.error(err);
        alert("Failed to copy.");
    }
});
</script>

<script src="../rotator.js"></script>

</body>
</html>
