<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>

    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../styles.css">

    <style>
        .search-wrapper {
            width: 100%;
            max-width: 700px;
            margin: 120px auto;
            padding: 0 20px;
        }

        .search-box {
            width: 100%;
            padding: 16px 20px;
            border: 1px solid #2b2b2d;
            border-radius: 14px;
            background: #1c1c1f;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.2s ease;
            font-family: inherit;
        }

        .search-box:focus {
            border-color: #4a4a4f;
        }

        .results {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            background: #1a1a1d;
            border-radius: 14px;
            padding: 18px;
            text-decoration: none;
            color: white;
            transition: 0.2s ease;
        }

        .result-card:hover {
            transform: translateY(-2px);
            border-color: #3b3b40;
        }

        .result-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .result-desc {
            opacity: 0.7;
            font-size: 14px;
            line-height: 1.5;
        }

        .no-results {
            opacity: 0.5;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">
        <a href="../index.html" style="text-decoration: none; color: inherit;">
            mizartz
        </a>
    </div>

    <div class="nav-center" id="rotating-text">
        wait hoe im loading!
    </div>

    <ul class="nav-links">
        <li>
            <a href="../directories/search.html"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="search">
                <img src="../images/icons/search.svg" alt="">
            </a>
        </li>

        <li>
            <a href="https://buymeacoffee.com/optic"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Buy me a coffee">
                <img src="../images/icons/coffee-cup.png" alt="">
            </a>
        </li>
    </ul>
</nav>

<main class="search-wrapper">

    <input 
        type="text" 
        class="search-box" 
        id="searchInput"
        placeholder="search stuff..."
    >

    <div class="results" id="results"></div>

</main>

<script>
    // your pages
    const pages = [
        {
            name: "JJS Domain Thing",
            desc: "Domain Expansion Frame work",
            url: "../directories/JJSDomainCode.html"
        },

        {
            name: "home",
            desc: "homepage",
            url: "../index.html"
        },

        {
            name: "a potato",
            desc: "just a potato",
            url: "../directories/potato.html"
        },


    ];

    const searchInput = document.getElementById("searchInput");
    const results = document.getElementById("results");

    function renderResults(query = "") {

        results.innerHTML = "";

        const filtered = pages.filter(page =>
            page.name.toLowerCase().includes(query.toLowerCase()) ||
            page.desc.toLowerCase().includes(query.toLowerCase())
        );

        if (filtered.length === 0) {
            results.innerHTML = `
                <div class="no-results">
                    nothing found vro
                </div>
            `;
            return;
        }

        filtered.forEach(page => {

            const card = document.createElement("a");

            card.className = "result-card";
            card.href = page.url;

            card.innerHTML = `
                <div class="result-title">${page.name}</div>
                <div class="result-desc">${page.desc}</div>
            `;

            results.appendChild(card);
        });
    }

    searchInput.addEventListener("input", (e) => {
        renderResults(e.target.value);
    });

    // show all on load
    renderResults();
</script>

<script src="../rotator.js"></script>
</body>
</html>
